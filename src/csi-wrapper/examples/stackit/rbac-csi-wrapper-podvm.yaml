apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-wrapper-podvm
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper-podvm
rules:
  - apiGroups: ["confidentialcontainers.org"]
    resources: ["peerpodvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["confidentialcontainers.org"]
    resources: ["peerpodvolumes/status"]
    verbs: ["update"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper-podvm
subjects:
  - kind: ServiceAccount
    name: csi-wrapper-podvm
    namespace: default
roleRef:
  kind: ClusterRole
  name: csi-wrapper-podvm
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper-podvm-nodeplugin
subjects:
  - kind: ServiceAccount
    name: csi-wrapper-podvm
    namespace: default
roleRef:
  kind: ClusterRole
  name: extensions.gardener.cloud:provider-openstack:csi-driver
  apiGroup: rbac.authorization.k8s.io
