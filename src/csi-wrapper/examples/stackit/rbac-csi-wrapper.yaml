apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-wrapper
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper
rules:
  - apiGroups: ["confidentialcontainers.org"]
    resources: ["peerpodvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["confidentialcontainers.org"]
    resources: ["peerpodvolumes/status"]
    verbs: ["update"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper
subjects:
  - kind: ServiceAccount
    name: csi-wrapper
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-wrapper
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-wrapper-node
subjects:
  - kind: ServiceAccount
    name: csi-driver-node
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-wrapper
  apiGroup: rbac.authorization.k8s.io
